# Builds TV guides (XMLTV) for the channels of the iptv-org US and UK playlists and publishes them on the
# "shelf-guide" branch, three times a day:
#   https://raw.githubusercontent.com/ganley100/epg/shelf-guide/guide.xml.gz      (US)
#   https://raw.githubusercontent.com/ganley100/epg/shelf-guide/guide-uk.xml.gz   (UK)
# shelf/make_channels.py picks one working guide site per channel (pictures first).

name: Shelf guide

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3,11,19 * * *'
  push:
    branches: [master]
    paths:
      - 'shelf/**'
      - '.github/workflows/shelf-guide.yml'

permissions:
  contents: write

concurrency:
  group: shelf-guide
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - country: us
            file: guide
            playlist: https://iptv-org.github.io/iptv/countries/us.m3u
            sites: zap2it.com,pluto.tv,plex.tv,tvguide.com,tvpassport.com,xumo.tv,distro.tv
            # Channels still without a guide, found by name (pictures first, then text-only listings)
            name_sites: zap2it.com,pluto.tv,plex.tv,i.mjh.nz,watch.whaletvplus.com,tvguide.com,tvpassport.com,xumo.tv,distro.tv,directv.com,ontvtonight.com,tvinsider.com,watchyour.tv
          # Sky first: a portrait poster for every show. Then Pluto and Plex (their own channels), then Freeview and the rest.
          - country: uk
            file: guide-uk
            playlist: https://iptv-org.github.io/iptv/countries/uk.m3u
            sites: sky.com,pluto.tv,plex.tv,freeview.co.uk,player.ee.co.uk,virgintvgo.virginmedia.com,tv24.co.uk,mytelly.co.uk
            name_sites: sky.com,pluto.tv,plex.tv,i.mjh.nz,freeview.co.uk,tv24.co.uk,watch.whaletvplus.com,mytelly.co.uk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Channels in the ${{ matrix.country }} playlist
        env:
          SHELF_COUNTRY: ${{ matrix.country }}
          SHELF_SITES: ${{ matrix.sites }}
          SHELF_NAME_SITES: ${{ matrix.name_sites }}
        run: python3 shelf/make_channels.py ${{ matrix.playlist }} shelf/${{ matrix.country }}.channels.xml

      - name: Grab two days of guide
        run: |
          mkdir -p out
          npm run grab --- --channels=shelf/${{ matrix.country }}.channels.xml --output=out/${{ matrix.file }}.xml --days=2 --maxConnections=10 --timeout=20000
          test -s out/${{ matrix.file }}.xml

      - name: Posters for every show
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          MAX_LOOKUPS: '1800'
        run: |
          python3 shelf/share.py shelf/${{ matrix.country }}.channels.xml out/${{ matrix.file }}.xml
          python3 shelf/posters.py out/${{ matrix.file }}.xml
          # Shows still without a poster: TVmaze (and TMDB with the TMDB_KEY secret), remembered between runs.
          curl -fsSL -o out/posters-${{ matrix.country }}.json "https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/posters-${{ matrix.country }}.json" || echo '{}' > out/posters-${{ matrix.country }}.json
          python3 shelf/fill_posters.py out/${{ matrix.file }}.xml out/posters-${{ matrix.country }}.json
          gzip -9 -k -f out/${{ matrix.file }}.xml
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: |
            out/${{ matrix.file }}.xml*
            out/posters-${{ matrix.country }}.json
          retention-days: 2

  publish:
    needs: grab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # A country whose grab failed keeps its last published guide.
      - name: Keep guides that weren't rebuilt
        run: |
          cd out
          for f in guide guide-uk; do
            if [ ! -s $f.xml.gz ]; then
              curl -fsSL -o $f.xml.gz "https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/$f.xml.gz" && gunzip -k -f $f.xml.gz || true
            fi
          done
          for c in us uk; do
            [ -s posters-$c.json ] || curl -fsSL -o posters-$c.json "https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/posters-$c.json" || true
          done
          ls -la

      - name: Publish to the shelf-guide branch
        run: |
          cd out
          line() { [ -s "$1.xml" ] || return 0; s=$(grep -o '<programme ' "$1.xml" | wc -l); p=$(grep -o '<programme [^>]*>' "$1.xml" | wc -l); i=$(python3 -c "import re,sys;x=open('$1.xml').read();print(sum(1 for m in re.finditer(r'<programme .*?</programme>',x,re.S) if '<icon' in m.group(0)))"); c=$(grep -o '<programme [^>]*channel="[^"]*"' "$1.xml" | sed 's/.*channel="//' | sort -u | wc -l); echo "- $2: ${c} channels, ${s} shows, ${i} with pictures. https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/$1.xml.gz"; }
          {
            echo "# Shelf guide"
            echo
            echo "TV guides (XMLTV) for the channels of the iptv-org playlists. Updated $(date -u '+%Y-%m-%d %H:%M') UTC, three times a day."
            echo
            line guide "US (iptv-org us.m3u)"
            line guide-uk "UK (iptv-org uk.m3u)"
          } > README.md
          cat README.md
          git init -q -b shelf-guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Guides $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shelf-guide

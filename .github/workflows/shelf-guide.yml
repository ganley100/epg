# Builds a TV guide (XMLTV) for the channels of the iptv-org US playlist and publishes it on the
# "shelf-guide" branch, three times a day:
#   https://raw.githubusercontent.com/ganley100/epg/shelf-guide/guide.xml.gz
# shelf/make_channels.py picks one working guide site per channel (pictures first).

name: Shelf guide

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3,11,19 * * *'
  push:
    branches: [master]
    paths:
      - 'shelf/**'
      - '.github/workflows/shelf-guide.yml'

permissions:
  contents: write

concurrency:
  group: shelf-guide
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Channels in the US playlist
        run: python3 shelf/make_channels.py https://iptv-org.github.io/iptv/countries/us.m3u shelf/us.channels.xml

      - name: Grab two days of guide
        run: |
          mkdir -p out
          npm run grab --- --channels=shelf/us.channels.xml --output=out/guide.xml --gzip --days=2 --maxConnections=10 --timeout=20000
          ls -la out
          test -s out/guide.xml

      - name: Publish to the shelf-guide branch
        run: |
          cd out
          test -f guide.xml.gz || gzip -9 -k guide.xml
          shows=$(grep -c '<programme' guide.xml || true)
          channels=$(grep -o '<programme [^>]*channel="[^"]*"' guide.xml | sed 's/.*channel="//' | sort -u | wc -l)
          cat > README.md <<MD
          # Shelf guide

          TV guide (XMLTV) for the channels of the iptv-org US playlist: ${channels} channels, ${shows} shows.
          Updated $(date -u '+%Y-%m-%d %H:%M') UTC, three times a day.

          - Compressed: https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/guide.xml.gz
          - Plain: https://raw.githubusercontent.com/${{ github.repository }}/shelf-guide/guide.xml
          MD
          git init -q -b shelf-guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml.gz guide.xml README.md
          git commit -qm "Guide $(date -u '+%Y-%m-%d %H:%M') UTC: ${channels} channels"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shelf-guide
